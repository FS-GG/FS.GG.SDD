# skill deliberately has MORE than one file so a dropped `files` array is visible. `scaffold` must
# fold the drivers + owner-sourced skills it materializes into this document with their own file
# sets, leaving it v2-COMPLETE rather than v2-in-the-header-only.
schemaVersion: 1
providers:
  - name: fixture
    contractVersion: "1.0.0"
    templateId: fsgg-fixture-skills-with-manifest-v2
