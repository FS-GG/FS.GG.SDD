# skill-union — thin caller for the shared reusable assertion (FS-GG/.github, ADR-0014 / #1504).
#
# This repo is declared a `skill-union` receiver in FS-GG/.github registry/repos.yml. The reusable
# workflow runs `scripts/skill-union-assert.sh` over this repository's OWN committed ADR-0011
# agent-skill roots and asserts the full union is present in every root and byte-identical across
# them. Fix drift by running, from this repo:
#
#     dotnet build src/FS.GG.Contracts/FS.GG.Contracts.fsproj -c Release
#     dotnet fsi scripts/materialize-skill-roots.fsx
#
# WHY THIS IS NOT REDUNDANT WITH coordination-coherence (.github#1504). The two gates check the
# three-root invariant over DIFFERENT SUBJECTS, and reading one as the other cost the org three
# partitioned repositories — this one included:
#
#   * `coordination-coherence` (`receives: coordination-kit`) audits the KIT-OWNED SUBSET — exactly
#     the four skills registry/repos.yml's `kit:` block names. It cannot see a co-tenant skill,
#     because a co-tenant skill is not in its subject.
#   * this gate (`receives: skill-union`) audits the COMPLETE runtime-visible UNION — every skill in
#     `.claude/skills`, `.codex/skills`, `.agents/skills`.
#
# Measured on main before FS.GG.SDD#716: `.claude`=32 `.codex`=21 `.agents`=4, union 32, with 28
# skills PARTITIONED and nothing divergent — and `coordination-coherence` green throughout, because
# the four kit skills really were coherent in all three roots. Agent runtimes received 4 skills
# where Claude received 32, and required CI was green about it. A `coordination-coherence` green is
# evidence about four skills; only a `skill-union` green is evidence about the tree.
#
# All mechanics + rationale live in the reusable workflow:
#   FS-GG/.github .github/workflows/skill-union-assert.yml
# and in FS-GG/.github docs/coordination/skill-union-assertion.md.
name: skill-union

# The `pull_request` trigger is deliberately UNSCOPED, and that is the documented alternative rather
# than a deviation: docs/coordination/skill-union-assertion.md §"The required receiver caller" arms
# the gate with "either it carries `paths:` covering all three, or it carries NO `paths:` filter at
# all (wider, and therefore fine)", and `scripts/repos-audit.sh` implements exactly that — an absent
# `paths:` key reads as unfiltered, therefore armed.
#
# Unfiltered is the correct choice HERE because criterion 4 of FS.GG.SDD#716 also makes
# `skill-union / skill-union` a REQUIRED status check on main, and this repo has already paid for
# the interaction between those two facts (#370 / #525): a `paths:`-scoped workflow does not run on
# a PR that touches none of its paths, so its check context never posts — and a REQUIRED context
# that never posts wedges every such PR at `Expected` forever. That is why the sibling required
# gate in this repo, `coordination-coherence.yml` (`kit / coordination-kit`), had its `paths:`
# filter REMOVED and carries a standing "do not re-add" note. The same reasoning governs this file:
# adding a `paths:` filter here would re-wedge the required context — do not.
#
# The assertion is a few seconds of shell over ~100 files, so running it on every PR is cheap; the
# cost of arming it conditionally is a wedged repository.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job id is load-bearing: GitHub names the status context `<caller job> / <callee job>`, so
  # this must stay `skill-union` for the required context `skill-union / skill-union` to keep
  # reporting. The callee job id is public API on the authority's side too (reusable-workflow-contract).
  skill-union:
    # No `with:` at all is the most correct form — `product-path` defaults to "." (this repository's
    # root, which is what `receives: skill-union` means) and `roots` to ADR-0011's three. Narrowing
    # either would be a smaller audit than the capability claims, and a `product-path` naming a
    # subdirectory would be a generated-product audit instead of this one.
    uses: FS-GG/.github/.github/workflows/skill-union-assert.yml@main
