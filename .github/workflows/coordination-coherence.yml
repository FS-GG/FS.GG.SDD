# coordination-coherence — thin caller for the shared reusable gate (FS-GG/.github, ADR-0019).
#
# This repo is declared a `coordination-kit` receiver in FS-GG/.github registry/repos.yml, so it
# holds a copy of the coordination kit: the shared coordination skills, plus the clients and the shell
# config they source, under `scripts/`. THE MEMBER LIST IS NOT RE-SPELLED HERE, for the same reason the
# destination count below is not — the pinned package's own `kit/kit-manifest.tsv` is the enumeration,
# it changes when the kit changes (0.18.0 dropped the engine tool-manifest row outright, ADR-0068), and
# a copy in a comment is a second answer that can disagree with it. A non-receiver would pass trivially;
# this repo is a receiver, so it is enforced.
#
# THE SKILL ROOTS ARE READ OFF THE DECLARATION, NOT OFF AN ADR'S ROOT COUNT (FS.GG.SDD#769). This
# sentence used to name `.claude/skills + .codex/skills + .agents/skills` — ADR-0011's three — and by
# the time anyone read it the pinned kit materialized into exactly one of them. A root count copied
# from an ADR number rots on the next amendment; a disposition read off the evaluated declaration
# cannot, because it is the same value that PERFORMS the materialize. The rows below are that value,
# and they are CHECKED rather than promised: leg F of `scripts/tests/materialize-skill-roots.test.sh`
# evaluates `.config/kit/FS.GG.Kit.receiver.proj` against the pin, leg H grades these three rows
# against that evaluation, and both run in the required `Deterministic gate (locked restore + build +
# test)` context — NOT in `kit / coordination-kit`, which this file otherwise describes.
#
#   fsgg-kit-roots: materialized  FsggKitSkillRoots         .claude/skills
#   fsgg-kit-roots: view          FsggKitViewSkillRoots     .agents/skills
#   fsgg-kit-roots: retired       FsggKitRetiredSkillRoots  .codex/skills
#
# Roots are space- or `;`-separated; `(none)` spells an empty set. The first two properties are
# declared by the receiver project itself, so those rows follow an edit made in this repo — edit the
# declaration and this block follows, or the gate says so. THE THIRD IS THE PINNED PACKAGE'S DEFAULT,
# so a Renovate FS.GG.Kit bump that changes the retired set reds that gate on a branch whose only diff
# is the pin, and the repair is an edit to this comment. That coupling is deliberate and it is not new:
# leg F already reds on the same bump.
#
# ONLY THE MATERIALIZED ROW IS GRADED HERE. `coordination-sync --against-pin` resolves its roots from
# `FsggKitSkillRoots` alone and places every skill row in each of those roots; the other two rows are
# somebody else's subject, or nobody's:
#
#   * the VIEW root is produced at checkout by `scripts/skill-view generate` and is never transported
#     or committed (ADR-0067 §6), so this gate has no delivered bytes to compare there. Whether the
#     view is actually VISIBLE to a runtime is the required `skill-view-check` context's question, and
#     whether anything lives under it that the source root does NOT carry — the class that a view
#     retirement deletes silently — is `scripts/check-root-asymmetry.sh`'s.
#   * the RETIRED root's CONTENT is graded by NOTHING, and that is the sentence a reader of this file
#     most needs. (Its DISPOSITION is graded — legs F and H above — which is a different question: that
#     the kit still calls it retired, not that anything audits what sits in it.)
#     The kit's retired-root sweep withdrew the four kit-owned coordination skills from `.codex/skills`
#     (FS.GG.SDD#730 for #762); what remains there is this repo's own `fs-gg-sdd-*` / `speckit-*` /
#     `spectre-console` skills, which no kit member reaches and no gate audits. Do not read a green
#     `kit / coordination-kit` as a statement about that root. Retiring it from this tree is ADR-0067
#     phase 4 (FS-GG/.github#1676).
#
# THE COMPARAND IS THIS REPO'S OWN PIN, NOT `.github@main` (FS-GG/.github#1584, FS.GG.SDD#731).
# The gate restores the exact FS.GG.Kit version THIS repo pins in Directory.Packages.local.props and
# verifies the materialized skill, client and config destinations against the sha256s that package's
# own kit-manifest.tsv ships. No byte of the hub reaches the comparison, so a hub commit can never
# retroactively red this repo.
#
# IT ALSO COVERS THE BUILD-CONFIG ROWS. This receiver declares
# FsggKitMaterializeBuildConfig=true, so Directory.Build.props and Directory.Packages.props are in
# the materializer's write set; include-build-config makes them part of this reusable gate's read set
# too. The shared build-config drift check remains a separate required guard for its own contract.
#
# AND IT ASSERTS NO STANDING DESTINATION COUNT WHILE SAYING SO (FS.GG.SDD#769). That sentence used to
# end "— 71 destinations, not 73 —". The figure was hand-computed from the three-root set corrected
# above, so it was wrong from the moment the kit narrowed the roots, and it was wrong in a way nothing
# could observe: a count in a comment has no subject to disagree with. It is deliberately NOT replaced
# by a fresh hand-computed one, because the graded set is a function of three things this file does not
# own — the pinned package's manifest rows, the reusable gate's row-kind-to-destination mapping (a
# skill row lands in each MATERIALIZED root; every other kind has exactly one destination), and
# `include-build-config` — and Renovate moves the first of those on its own schedule. This repo went
# FS.GG.Kit 0.15.0 → 0.18.0 inside a day, and 0.18.0 dropped a kit row outright (ADR-0068 took the
# engine tool manifest off the kit; see the receiver project's note).
#
# What a MEASUREMENT looks like, so nobody has to recompute one: the required `kit / coordination-kit`
# context prints the whole verdict in its own job log. Run 30406066077, on `main` at aa1bd95,
# 2026-07-28 — a real green run, quoted rather than derived:
#
#   coordination-sync: pin = 0.18.0 (from Directory.Packages.local.props -> 0.18.0)
#   … (the `comparand = …nupkg` line, elided for width)
#   coordination-sync: skill roots = .claude/skills (from .config/kit/FS.GG.Kit.receiver.proj <FsggKitSkillRoots>)
#   … (one `ok: <path>` line per graded destination)
#   coordination-sync: OK — all 27 materialized file(s) match the FS.GG.Kit 0.18.0 this tree pins.
#
# Those 27 are the graded set AT THAT PIN — not a constant, and not a property of this workflow. The
# `skill roots` line is also the gate's own confirmation of the `materialized` row above: it names the
# same property and resolves it from the same file. Read the current numbers off the newest run, never
# off this comment.
#
# BOTH ARMS RESOLVE THE KIT FROM THE SAME REF, AND THAT IS THE FIX (#731 AC3). They did NOT always.
# The gate used to check out `FS-GG/.github@main` as the comparand on both triggers, and additionally
# hand the PR arm a `--base-ref` so it reported only branch-AUTHORED drift (#450) while `push` did a
# strict compare. Two arms, one tree, different verdicts — and because the comparand itself moved,
# `kit / coordination-kit` PASSED on merged SHA 0376309 at 08:15Z and FAILED on byte-identical content
# at 08:21Z, purely because a hub commit landed at 08:05:39Z in between. A required context that can
# go red with nothing changed does not gate a merge, which is what #731 was filed about.
# A pin-relative comparand is read out of the branch's own tree, so it moves WITH the branch and
# attribution has nothing left to attribute: `--base-ref` is DROPPED, the script refuses it together
# with `--against-pin`, and both arms now answer the identical question.
#
# STALENESS IS A DIFFERENT QUESTION WITH A DIFFERENT OWNER. A correctly materialized tree on an
# out-of-date pin is legitimately green here. "Is my pin CURRENT?" belongs to the kit-pin freshness
# sweep in FS-GG/.github scripts/repos-audit.sh (#1540), which runs daily and reds on any stale pin.
# Do not add a staleness opinion to this gate.
#
# FIX DRIFT by bumping the FS.GG.Kit pin in Directory.Packages.local.props and re-materializing:
#   dotnet build .config/kit/FS.GG.Kit.receiver.proj -t:FsggKitMaterialize
# Renovate normally does the bump and kit-materialize.yml re-materializes on that PR. Do NOT byte-copy
# from a `.github` checkout: the tree would then disagree with the pin it is graded against, which
# turns this gate RED rather than green.
#
# All mechanics + rationale live in the reusable workflow:
#   FS-GG/.github .github/workflows/coordination-coherence.yml
name: coordination-coherence

# The PR trigger is UNSCOPED — it runs on every PR, matching the sibling receivers. It once carried a
# `paths:` filter (#370) so it fired only on PRs that touched a kit file, because the comparand was
# then `FS-GG/.github@main` — a MOVING TARGET — so mid-sync-window the strict compare went red on EVERY
# open PR at once, naming files the PR never touched (PR #366 reddened on a one-line F# test change).
#
# That workaround is REDUNDANT and was REMOVED (#525). It was first made safe by attribution (#450),
# and is now made unnecessary outright by the pin-relative comparand (#1584, see the header): a branch
# carries its own pin AND that pin's files, so a PR that never touches the kit cannot be red for
# drift it did not author. The one PR that legitimately reds is a pin bump before the kit is
# re-materialized on it — correct, and fixable in the branch.
#
# The filter HAD to go: a `paths:`-scoped workflow does not run on a non-kit PR, so its check context
# never posts — and a REQUIRED context that never posts wedges every such PR at `Expected` forever.
# Dropping the filter makes `kit / coordination-kit` report a concluded status on every PR, which is
# the precondition FS-GG/.github#490 needs to mark it required across the receivers. Re-adding a
# `paths:` filter here would re-wedge the required context — do not.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kit:
    uses: FS-GG/.github/.github/workflows/coordination-coherence.yml@main
    with:
      include-build-config: true
