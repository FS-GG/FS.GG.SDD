name: release

# Producer of the cross-repo auto-update fabric. On a release of FS.GG.SDD (or a pushed
# v* tag, or a manual dispatch), a single run publishes THREE packages to the org GitHub
# Packages feed (nuget.pkg.github.com/FS-GG): FS.GG.Contracts (the org-shared contracts
# line), FS.GG.SDD.Artifacts (the independently consumable lifecycle/specification contracts),
# and FS.GG.SDD.Cli (the `fsgg-sdd` dotnet tool). Versions come from each project's own
# version properties — this header pins none, to avoid staleness. All three push with
# --skip-duplicate using the run-scoped GITHUB_TOKEN (packages: write, no
# PAT), only from the canonical repo.
#
# THE CONTRACT for triggers + version-resolution + gating + the three-package scope is
# specs/044-publish-cli-tool/contracts/release-workflow.md (it supersedes feature 039's
# single-package producer contract). This YAML is its implementation, not folklore. Each
# package's published version is its EVALUATED fsproj <Version> (msbuild -getProperty); a
# release tag is a coherence check that must match AT LEAST ONE of the three lines, never the
# source (research Decisions 2-3; FR-014 reconciliation).

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit FS.GG.Contracts version to publish. Omit for a pack-only dry run."
        type: string
        required: false

permissions:
  contents: read

# A single tagged release fires BOTH `release: published` and `push: tags v*`. Serialize the
# paired runs (cancel-in-progress: false) keyed on the version/tag so they never push
# simultaneously and no push is cancelled mid-flight; the second run no-ops via
# --skip-duplicate. This is deliberately NOT gate.yml's cancel-in-progress: true PR key.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Shared version-resolution state machine — see the contract's version-resolution table.
  # Evaluates all three fsproj <Version>s (msbuild -getProperty, not a grep) and applies the
  # at-least-one-line tag guard, then hands contracts_version / cli_version / push to the
  # three publish jobs. Fork events never satisfy the repo guard ⇒ no publish path runs.
  resolve-versions:
    name: Resolve versions (three lines)
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD'
    outputs:
      contracts_version: ${{ steps.ver.outputs.contracts_version }}
      artifacts_version: ${{ steps.ver.outputs.artifacts_version }}
      cli_version: ${{ steps.ver.outputs.cli_version }}
      push: ${{ steps.ver.outputs.push }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # No restore cache: this job restores a single project (narrow footprint) and
          # setup-dotnet keys the cache only on hashFiles(packages.lock.json)+OS+runtime with
          # no per-job component, so caching here would share and poison the deterministic
          # gate's key (#92 / NU1403). Release runs rarely; a fresh restore is fine.

      # Source of truth is the EVALUATED fsproj <Version> for each line. The release/tag
      # event's tag is a coherence check against all three lines, never the source. A
      # version-bearing tag must match AT LEAST ONE evaluated version (research Decision 2).
      - name: Resolve versions
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          strip_v() { printf '%s' "${1#v}"; }

          contracts_version="$(dotnet msbuild src/FS.GG.Contracts/FS.GG.Contracts.fsproj -getProperty:Version)"
          contracts_version="$(printf '%s' "$contracts_version" | tr -d '[:space:]')"
          artifacts_version="$(dotnet msbuild src/FS.GG.SDD.Artifacts/FS.GG.SDD.Artifacts.fsproj -getProperty:Version)"
          artifacts_version="$(printf '%s' "$artifacts_version" | tr -d '[:space:]')"
          cli_version="$(dotnet msbuild src/FS.GG.SDD.Cli/FS.GG.SDD.Cli.fsproj -getProperty:Version)"
          cli_version="$(printf '%s' "$cli_version" | tr -d '[:space:]')"

          if [ -z "$artifacts_version" ] || [ "$artifacts_version" != "$cli_version" ]; then
            echo "::error::FS.GG.SDD.Artifacts ($artifacts_version) and FS.GG.SDD.Cli ($cli_version) must share one coherent-set version."
            exit 1
          fi

          push=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_VERSION:-}" ]; then
              # Manual override: publish exactly the requested Contracts version; the CLI
              # always tracks its evaluated version (the `version` input is Contracts-scoped).
              contracts_version="$(strip_v "$INPUT_VERSION")"
              if [ -z "$cli_version" ]; then
                echo "::error::could not read <Version> from FS.GG.SDD.Cli.fsproj (build defect)."
                exit 1
              fi
              push="true"
            else
              # Intentional dry run: pack all three fsproj versions, push nothing (FR-004).
              if [ -z "$contracts_version" ] || [ -z "$artifacts_version" ] || [ -z "$cli_version" ]; then
                echo "::error::could not read <Version> from one of the fsprojs (build defect)."
                exit 1
              fi
              push="false"
              echo "::notice::dry run — packing FS.GG.Contracts $contracts_version and FS.GG.SDD.Cli $cli_version but NOT pushing (manual dispatch with no version input)."
            fi
          else
            # release: published  OR  push: tags v*  — a real publish from the fsproj versions.
            # Unreadable version is a defect: fail, never silently degrade to a dry run (FR-006).
            if [ -z "$contracts_version" ] || [ -z "$artifacts_version" ] || [ -z "$cli_version" ]; then
              echo "::error::could not read <Version> from one of the fsprojs on a $EVENT_NAME event (build defect); refusing to silently skip the publish."
              exit 1
            fi

            tag="$RELEASE_TAG"
            [ -z "$tag" ] && tag="$REF_NAME"

            # At-least-one-line guard: a version-bearing tag (v<semver>) must equal the
            # Contracts, Artifacts, OR CLI evaluated version. A non-version-bearing tag is fine — the
            # fsprojs are authoritative. Each package then publishes its own resolved version
            # regardless of which line the tag matched (FR-005; research Decision 2).
            if printf '%s' "$tag" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
              tag_version="$(strip_v "$tag")"
              if [ "$tag_version" != "$contracts_version" ] && [ "$tag_version" != "$artifacts_version" ] && [ "$tag_version" != "$cli_version" ]; then
                echo "::error::release tag '$tag' (version $tag_version) matches none of the evaluated package versions: Contracts=$contracts_version Artifacts=$artifacts_version CLI=$cli_version. The fsprojs are the source of truth; reconcile the tag or a fsproj before releasing."
                exit 1
              fi
            fi

            push="true"
          fi

          echo "contracts_version=$contracts_version" >> "$GITHUB_OUTPUT"
          echo "artifacts_version=$artifacts_version" >> "$GITHUB_OUTPUT"
          echo "cli_version=$cli_version" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Resolved: contracts_version=$contracts_version artifacts_version=$artifacts_version cli_version=$cli_version push=$push (event=$EVENT_NAME)"

  contracts-tests:
    name: Contracts tests (publish gate)
    runs-on: ubuntu-latest
    # Fork events never satisfy this guard ⇒ no publish path runs on a fork (FR-009).
    if: github.repository == 'FS-GG/FS.GG.SDD'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # No restore cache: this job restores a single project (narrow footprint) and
          # setup-dotnet keys the cache only on hashFiles(packages.lock.json)+OS+runtime with
          # no per-job component, so caching here would share and poison the deterministic
          # gate's key (#92 / NU1403). Release runs rarely; a fresh restore is fine.

      # Locked restore via the shared composite action (feature 064): any
      # dependency-graph drift or silently substituted version (NU1603) fails here.
      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: tests/FS.GG.Contracts.Tests/FS.GG.Contracts.Tests.fsproj

      # The gate (FR-003): publish-contracts `needs` this job, so a red run never reaches the push.
      - name: Test (FS.GG.Contracts)
        run: dotnet test tests/FS.GG.Contracts.Tests/FS.GG.Contracts.Tests.fsproj -c Release --no-restore

  artifacts-tests:
    name: Artifacts tests (publish gate)
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: tests/FS.GG.SDD.Artifacts.Tests/FS.GG.SDD.Artifacts.Tests.fsproj

      - name: Test (FS.GG.SDD.Artifacts)
        run: dotnet test tests/FS.GG.SDD.Artifacts.Tests/FS.GG.SDD.Artifacts.Tests.fsproj -c Release --no-restore

      - name: Verify clean package consumption
        run: tests/fixtures/typed-specifications/run-clean-consumer.sh

  cli-tests:
    name: CLI tests (publish gate)
    runs-on: ubuntu-latest
    # Fork events never satisfy this guard ⇒ no publish path runs on a fork (FR-009).
    if: github.repository == 'FS-GG/FS.GG.SDD'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # No restore cache: this job restores a single project (narrow footprint) and
          # setup-dotnet keys the cache only on hashFiles(packages.lock.json)+OS+runtime with
          # no per-job component, so caching here would share and poison the deterministic
          # gate's key (#92 / NU1403). Release runs rarely; a fresh restore is fine.

      # Locked restore via the shared composite action (feature 064).
      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: tests/FS.GG.SDD.Cli.Tests/FS.GG.SDD.Cli.Tests.fsproj

      # The gate (research Decision 6): publish-cli `needs` this job, so a red run never
      # reaches the push. ValidateCommandTests covers `registry validate` here.
      - name: Test (FS.GG.SDD.Cli)
        run: dotnet test tests/FS.GG.SDD.Cli.Tests/FS.GG.SDD.Cli.Tests.fsproj -c Release --no-restore

  publish-contracts:
    name: Pack + publish FS.GG.Contracts
    # A real coherent release may not touch either feed until the retained SDD candidate exists.
    # On a no-push dispatch locate-artifacts succeeds without a lookup, so Contracts still packs.
    needs: [resolve-versions, contracts-tests, locate-artifacts]
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD'
    # Least-privilege: only this job gains packages: write; the push uses the run-scoped
    # GITHUB_TOKEN, never a PAT (FR-002).
    permissions:
      contents: read
      packages: write
      id-token: write   # ADR-0013: mint the GitHub OIDC token for nuget.org Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # No restore cache: this job restores a single project (narrow footprint) and
          # setup-dotnet keys the cache only on hashFiles(packages.lock.json)+OS+runtime with
          # no per-job component, so caching here would share and poison the deterministic
          # gate's key (#92 / NU1403). Release runs rarely; a fresh restore is fine.

      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: src/FS.GG.Contracts/FS.GG.Contracts.fsproj

      # Single explicit project ⇒ single-package scope (FR-001). --no-restore reuses the
      # locked restore above. Version comes from the shared resolve-versions job (FR-014 —
      # the only Contracts delta is the relaxed cross-line tag guard).
      - name: Pack
        run: |
          set -euo pipefail
          dotnet pack src/FS.GG.Contracts/FS.GG.Contracts.fsproj -c Release \
            -p:Version=${{ needs.resolve-versions.outputs.contracts_version }} --no-restore -o artifacts/packages

      # A green test plus an empty pack MUST NOT report success (FR-007): fail loudly if
      # nothing was packed.
      - name: Assert a package was produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::pack produced no .nupkg — the tests passed but there is nothing to publish."
            exit 1
          fi
          printf 'Packed: %s\n' "${packages[@]}"

      # Push only when push==true (a dry run skips this entirely, FR-004). --skip-duplicate
      # makes a re-publish of an existing version an idempotent no-op success (FR-008); any
      # other push failure fails the run (FR-012).
      - name: Push to the org feed
        if: needs.resolve-versions.outputs.push == 'true'
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      # Dual-publish the BYTE-IDENTICAL gate-verified .nupkg to public nuget.org (ADR-0012 §1–§5)
      # via Trusted Publishing / OIDC (ADR-0013 — no stored key). Runs AFTER the org-feed push
      # (gated ordering, ADR-0012 §4): if that step fails the job stops before this one. NuGet/login
      # mints a single-use key from the org's Trusted Publishing policy (fs-gg-sdd-release); until the
      # policy exists it 401s and fails the release loud.
      - name: NuGet login (OIDC → short-lived nuget.org key)
        if: needs.resolve-versions.outputs.push == 'true'
        id: nuget-login-contracts
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      - name: Push to nuget.org (public)
        if: needs.resolve-versions.outputs.push == 'true'
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login-contracts.outputs.NUGET_API_KEY }} \
            --skip-duplicate

  publish-artifacts:
    name: Build and retain coherent FS.GG.SDD 1.x candidate once
    needs: [resolve-versions, artifacts-tests, cli-tests]
    runs-on: ubuntu-latest
    # Only a no-push manual dispatch is allowed to create publishable archives. A later tag/release
    # run promotes this run's retained artifact; it must never pack another container (#944).
    if: github.repository == 'FS-GG/FS.GG.SDD' && needs.resolve-versions.outputs.push == 'false'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: src/FS.GG.SDD.Cli/FS.GG.SDD.Cli.fsproj

      - name: Pack the reviewed coherent set once
        run: |
          set -euo pipefail
          dotnet pack src/FS.GG.SDD.Artifacts/FS.GG.SDD.Artifacts.fsproj -c Release \
            -p:RepositoryCommit="$GITHUB_SHA" -p:SourceRevisionId="$GITHUB_SHA" \
            --no-restore -o artifacts/packages
          dotnet pack src/FS.GG.SDD.Cli/FS.GG.SDD.Cli.fsproj -c Release \
            -p:RepositoryCommit="$GITHUB_SHA" -p:SourceRevisionId="$GITHUB_SHA" \
            --no-restore -o artifacts/packages

      - name: Assert package inventory, source binding, and pre-push hashes
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/packages/FS.GG.SDD.Artifacts.*.nupkg artifacts/packages/FS.GG.SDD.Cli.*.nupkg)
          if [ ${#packages[@]} -ne 2 ]; then
            echo "::error::coherent pack must produce exactly Artifacts and CLI."
            exit 1
          fi
          for package in "${packages[@]}"; do
            unzip -p "$package" '*.nuspec' | grep -F "commit=\"$GITHUB_SHA\"" >/dev/null \
              || { echo "::error::$package does not bind repository commit $GITHUB_SHA"; exit 1; }
          done
          (
            cd artifacts/packages
            sha256sum FS.GG.SDD.Artifacts.*.nupkg FS.GG.SDD.Cli.*.nupkg | LC_ALL=C sort -k2 > pre-push.sha256
          )
          printf '%s\n' \
            'schema=fsgg.sdd.release-candidate/v1' \
            "head=$GITHUB_SHA" \
            "version=${{ needs.resolve-versions.outputs.cli_version }}" \
            'packages=FS.GG.SDD.Artifacts,FS.GG.SDD.Cli' \
            > artifacts/packages/candidate.env
          bash scripts/verify-release-candidate.sh \
            artifacts/packages "$GITHUB_SHA" "${{ needs.resolve-versions.outputs.cli_version }}"

      - name: Verify the just-packed CLI is self-contained
        env:
          FSGG_SDD_PACKAGE_DIR: artifacts/packages
        run: bash scripts/verify-cli-tool.sh

      - name: Upload the only publishable package bytes
        uses: actions/upload-artifact@v4
        with:
          name: coherent-sdd-packages-${{ github.sha }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 30

  locate-artifacts:
    name: Preflight retained candidate custody
    needs: [resolve-versions, artifacts-tests, cli-tests]
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD'
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_run_id: ${{ steps.locate.outputs.candidate_run_id }}
    steps:
      - name: Locate one successful no-push candidate run at the exact head
        id: locate
        if: needs.resolve-versions.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&status=completed&per_page=100" \
              | jq -r --arg head "$GITHUB_SHA" \
                  '.[] | .workflow_runs[] | select(.head_sha == $head and .conclusion == "success") | .id'
          )
          matches=()
          for run_id in "${run_ids[@]}"; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              | jq --arg name "coherent-sdd-packages-$GITHUB_SHA" \
                  '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
            [ "$count" -eq 0 ] || [ "$count" -eq 1 ] \
              || { echo "::error::run $run_id has duplicate coherent candidate artifacts"; exit 1; }
            [ "$count" -eq 1 ] && matches+=("$run_id")
          done
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error::expected exactly one retained no-push candidate for $GITHUB_SHA; found ${#matches[@]}. Dispatch release.yml without a version exactly once at this commit before tagging/publishing."
            exit 1
          fi
          echo "candidate_run_id=${matches[0]}" >> "$GITHUB_OUTPUT"
          echo "Promoting retained candidate from workflow run ${matches[0]} at $GITHUB_SHA"

      - name: Dry-run custody preflight
        if: needs.resolve-versions.outputs.push == 'false'
        run: echo "No-push dispatch will create the retained candidate in publish-artifacts."

  publish-cli:
    name: Publish and read back the coherent FS.GG.SDD set
    needs: [resolve-versions, locate-artifacts]
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD' && needs.resolve-versions.outputs.push == 'true'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Download the reviewed package bytes
        uses: actions/download-artifact@v4
        with:
          name: coherent-sdd-packages-${{ github.sha }}
          path: artifacts/packages
          run-id: ${{ needs.locate-artifacts.outputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify retained candidate identity and hashes before feed credentials
        run: |
          set -euo pipefail
          bash scripts/verify-release-candidate.sh \
            artifacts/packages "$GITHUB_SHA" "${{ needs.resolve-versions.outputs.cli_version }}"

      - name: Publish both packages to GitHub Packages first
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Artifacts.*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Cli.*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: NuGet login (OIDC → short-lived nuget.org key)
        id: nuget-login-sdd
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}

      - name: Publish the same bytes to nuget.org
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Artifacts.*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login-sdd.outputs.NUGET_API_KEY }} --skip-duplicate
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Cli.*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login-sdd.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Read back both feeds and compare every non-signature entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-versions.outputs.cli_version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/feed-readback
          for id in fs.gg.sdd.artifacts fs.gg.sdd.cli; do
            case "$id" in
              fs.gg.sdd.artifacts) local_package="artifacts/packages/FS.GG.SDD.Artifacts.$VERSION.nupkg" ;;
              fs.gg.sdd.cli) local_package="artifacts/packages/FS.GG.SDD.Cli.$VERSION.nupkg" ;;
            esac
            [ -f "$local_package" ] || { echo "::error::reviewed package is missing for $id $VERSION"; exit 1; }
            gh_url="https://nuget.pkg.github.com/FS-GG/download/$id/$VERSION/$id.$VERSION.nupkg"
            nuget_url="https://api.nuget.org/v3-flatcontainer/$id/$VERSION/$id.$VERSION.nupkg"
            for attempt in $(seq 1 30); do
              curl --fail --location --silent --show-error -u "$GITHUB_ACTOR:$GH_TOKEN" \
                "$gh_url" -o "artifacts/feed-readback/$id.github.nupkg" && \
              curl --fail --location --silent --show-error \
                "$nuget_url" -o "artifacts/feed-readback/$id.nuget.nupkg" && break
              [ "$attempt" -lt 30 ] || { echo "::error::feed readback timed out for $id $VERSION"; exit 1; }
              sleep 10
            done
            for feed in local github nuget; do
              if [ "$feed" = local ]; then
                package="$local_package"
              else
                package="artifacts/feed-readback/$id.$feed.nupkg"
              fi
              unzip -Z1 "$package" | grep -v '^\.signature\.p7s$' | LC_ALL=C sort >"$package.entries"
              while IFS= read -r entry; do
                printf '%s  %s\n' "$(unzip -p "$package" "$entry" | sha256sum | cut -d' ' -f1)" "$entry"
              done <"$package.entries" >"$package.payloads"
            done
            diff -u "$local_package.payloads" \
              "artifacts/feed-readback/$id.github.nupkg.payloads"
            diff -u "$local_package.payloads" \
              "artifacts/feed-readback/$id.nuget.nupkg.payloads"
          done

      - name: Verify clean public installs
        env:
          VERSION: ${{ needs.resolve-versions.outputs.cli_version }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          export NUGET_PACKAGES="$scratch/packages"
          export NUGET_HTTP_CACHE_PATH="$scratch/http"
          dotnet tool install FS.GG.SDD.Cli --version "$VERSION" --tool-path "$scratch/tool" \
            --add-source https://api.nuget.org/v3/index.json --no-cache
          "$scratch/tool/fsgg-sdd" --version | grep -F "$VERSION"
          dotnet new classlib -o "$scratch/consumer" --no-restore
          dotnet add "$scratch/consumer" package FS.GG.SDD.Artifacts --version "$VERSION" \
            --source https://api.nuget.org/v3/index.json --no-restore
          dotnet restore "$scratch/consumer" --source https://api.nuget.org/v3/index.json --no-http-cache

      - name: Set up exact Go toolchain for public Quint acceptance
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: false

      - name: Provision content-addressed Quint acceptance tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quint-release-tools"
          curl --fail --location --silent --show-error \
            https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 \
            --output "$RUNNER_TEMP/quint-release-tools/quint"
          chmod +x "$RUNNER_TEMP/quint-release-tools/quint"
          printf '%s  %s\n' \
            '939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f' \
            "$RUNNER_TEMP/quint-release-tools/quint" | sha256sum --check --strict
          (
            cd src/FS.GG.SDD.Artifacts/TypedSpecifications/QuintAssets/lmt
            GO111MODULE=off go build -trimpath \
              -ldflags '-buildid=IvXAt1kJ-3iINki1alCT/Ut12KGabgkWIkwVpw-xO/c4zkZMLAubfWHvjZOY8o/8-oR_8tNNndNgfMVoD8F -B 0x03d1703027f57ed4dd2ba90b7cdfc8cdea2815da' \
              -o "$RUNNER_TEMP/quint-release-tools/lmt" main.go
          )
          printf '%s  %s\n' \
            '37e0b0365c2641edce40b48605471f61fa12e97c3e2376152f0e849abdc31f10' \
            "$RUNNER_TEMP/quint-release-tools/lmt" | sha256sum --check --strict
          dotnet tool install fable --version 5.13.0 --tool-path "$RUNNER_TEMP/quint-release-tools/fable"

      - name: Rerun Q2 proof and Q3 lifecycle from the public CLI package
        env:
          QUINT_BIN: ${{ runner.temp }}/quint-release-tools/quint
          LMT_BIN: ${{ runner.temp }}/quint-release-tools/lmt
          FABLE_BIN: ${{ runner.temp }}/quint-release-tools/fable/fable
          Q2_PACKAGE_SOURCE: https://api.nuget.org/v3/index.json
          Q3_PACKAGE_SOURCE: https://api.nuget.org/v3/index.json
          Q2_JUNIT_OUT: artifacts/feed-readback/quint-q2-public.junit.xml
          Q3_JUNIT_OUT: artifacts/feed-readback/quint-q3-public.junit.xml
        run: |
          set -euo pipefail
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/true
          bash tests/quint-q3-typed-sdd-acceptance.sh

      - name: Upload durable dual-feed receipt
        uses: actions/upload-artifact@v4
        with:
          name: sdd-1.5.1-dual-feed-receipt-${{ github.sha }}
          path: |
            artifacts/packages/pre-push.sha256
            artifacts/packages/*.nupkg.entries
            artifacts/packages/*.nupkg.payloads
            artifacts/feed-readback/*.payloads
            artifacts/feed-readback/*.entries
            artifacts/feed-readback/quint-q*-public.junit.xml
          if-no-files-found: error
          retention-days: 90
