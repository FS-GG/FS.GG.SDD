name: GOV423 selected package loader qualification

# Qualification branch only. It consumes the original no-push candidate unchanged.
# No release trigger, producer build/pack, publication, secrets or default-branch change.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gov423-selected-package-loader-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Cold exact-closure loader API qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          cache: false
      - name: Check source-only preparation
        run: python3 tests/fixtures/gov423-loader-package/preflight.py
      - name: Qualify original packages in an isolated consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/fixtures/gov423-loader-package/qualify.py "$RUNNER_TEMP/gov423-loader-evidence"
      - name: Retain exact inputs and observed result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gov423-loader-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gov423-loader-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
