name: release

# One retained coherent set: Artifacts, Commands, CLI and Knowledge share their
# source-evaluated version. Published Contracts 7.6.0 is an independently qualified
# dependency from its original source, never packed or pushed by this rail.
# Candidate custody is v4; v3 Contracts-plus-three-SDD artifacts remain historical.
# Contract: specs/044-publish-cli-tool/contracts/release-workflow.md.

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit coherent FS.GG.SDD version to publish. Omit for a pack-only dry run."
        type: string
        required: false
      readback_version:
        description: "Read-only dual-feed verification of an already-published coherent SDD version"
        type: string
        required: false

permissions:
  contents: read

# A single tagged release fires BOTH `release: published` and `push: tags v*`. Serialize the
# paired runs (cancel-in-progress: false) keyed on the version/tag so they never push
# simultaneously and no push is cancelled mid-flight; the second run no-ops via
# --skip-duplicate. This is deliberately NOT gate.yml's cancel-in-progress: true PR key.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Shared version-resolution state machine — see the contract's version-resolution table.
  # Reads the exact published Contracts dependency pin and evaluates all four SDD project versions.
  # The event version must match the coherent SDD source, then contracts_version / cli_version / push go to the
  # retained publisher. Fork events never satisfy the repo guard ⇒ no publish path runs.
  resolve-versions:
    name: Resolve published Contracts and four coherent SDD versions
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version == ''
    outputs:
      contracts_version: ${{ steps.ver.outputs.contracts_version }}
      artifacts_version: ${{ steps.ver.outputs.artifacts_version }}
      commands_version: ${{ steps.ver.outputs.commands_version }}
      cli_version: ${{ steps.ver.outputs.cli_version }}
      knowledge_version: ${{ steps.ver.outputs.knowledge_version }}
      push: ${{ steps.ver.outputs.push }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check four-package release custody before evaluation
        run: python3 scripts/check-release-custody.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # No restore cache: this job restores a single project (narrow footprint) and
          # setup-dotnet keys the cache only on hashFiles(packages.lock.json)+OS+runtime with
          # no per-job component, so caching here would share and poison the deterministic
          # gate's key (#92 / NU1403). Release runs rarely; a fresh restore is fine.

      # Source versions are evaluated, never supplied by a tag or manual override.
      # Published Contracts stays on its independently selected exact package pin.
      - name: Resolve versions
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          strip_v() { printf '%s' "${1#v}"; }

          contracts_version="$(python3 - <<'PYCONTRACTS'
          import xml.etree.ElementTree as E
          rows=[item.get('Version') for item in E.parse('Directory.Packages.local.props').getroot().iter('PackageVersion') if item.get('Include')=='FS.GG.Contracts']
          if rows != ['[7.6.0]']: raise SystemExit('release requires the exact selected published Contracts package pin')
          print(rows[0][1:-1])
          PYCONTRACTS
          )"
          artifacts_version="$(dotnet msbuild src/FS.GG.SDD.Artifacts/FS.GG.SDD.Artifacts.fsproj -getProperty:Version)"
          artifacts_version="$(printf '%s' "$artifacts_version" | tr -d '[:space:]')"
          cli_version="$(dotnet msbuild src/FS.GG.SDD.Cli/FS.GG.SDD.Cli.fsproj -getProperty:Version)"
          cli_version="$(printf '%s' "$cli_version" | tr -d '[:space:]')"

          commands_version="$(dotnet msbuild src/FS.GG.SDD.Commands/FS.GG.SDD.Commands.fsproj -getProperty:Version)"
          commands_version="$(printf '%s' "$commands_version" | tr -d '[:space:]')"
          knowledge_version="$(dotnet msbuild src/FS.GG.SDD.Knowledge/FS.GG.SDD.Knowledge.fsproj -getProperty:Version)"
          knowledge_version="$(printf '%s' "$knowledge_version" | tr -d '[:space:]')"

          for resolved in "$artifacts_version" "$commands_version" "$cli_version" "$knowledge_version"; do
            [[ "$resolved" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid source version $resolved"; exit 1; }
            [ "$resolved" = "$cli_version" ] || { echo "::error::all four SDD projects must share one coherent version"; exit 1; }
          done
          push="true"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "${INPUT_VERSION:-}" ]; then
              [ "$(strip_v "$INPUT_VERSION")" = "$cli_version" ] || { echo '::error::manual SDD version differs from source'; exit 1; }
            else
              push="false"
              echo "::notice::dry run: pack four SDD members; reuse Contracts $contracts_version; no push"
            fi
          else
            tag="$RELEASE_TAG"
            [ -n "$tag" ] || tag="$REF_NAME"
            if printf '%s' "$tag" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
              [ "$(strip_v "$tag")" = "$cli_version" ] || { echo '::error::release tag differs from coherent SDD source'; exit 1; }
            fi
          fi

          echo "contracts_version=$contracts_version" >> "$GITHUB_OUTPUT"
          echo "artifacts_version=$artifacts_version" >> "$GITHUB_OUTPUT"
          echo "commands_version=$commands_version" >> "$GITHUB_OUTPUT"
          echo "cli_version=$cli_version" >> "$GITHUB_OUTPUT"
          echo "knowledge_version=$knowledge_version" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Resolved: contracts_version=$contracts_version artifacts_version=$artifacts_version cli_version=$cli_version push=$push (event=$EVENT_NAME)"

  contracts-tests:
    name: Contracts tests (publish gate)
    runs-on: ubuntu-latest
    # Fork events never satisfy this guard ⇒ no publish path runs on a fork (FR-009).
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # No restore cache: this job restores a single project (narrow footprint) and
          # setup-dotnet keys the cache only on hashFiles(packages.lock.json)+OS+runtime with
          # no per-job component, so caching here would share and poison the deterministic
          # gate's key (#92 / NU1403). Release runs rarely; a fresh restore is fine.

      # Locked restore via the shared composite action (feature 064): any
      # dependency-graph drift or silently substituted version (NU1603) fails here.
      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: tests/FS.GG.Contracts.Tests/FS.GG.Contracts.Tests.fsproj

      # Source Contracts tests remain a prerequisite; this dependency is not packed or published.
      - name: Test (FS.GG.Contracts)
        run: dotnet test tests/FS.GG.Contracts.Tests/FS.GG.Contracts.Tests.fsproj -c Release --no-restore

  artifacts-tests:
    name: Artifacts tests (publish gate)
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: tests/FS.GG.SDD.Artifacts.Tests/FS.GG.SDD.Artifacts.Tests.fsproj

      - name: Test (FS.GG.SDD.Artifacts)
        run: dotnet test tests/FS.GG.SDD.Artifacts.Tests/FS.GG.SDD.Artifacts.Tests.fsproj -c Release --no-restore

      - name: Verify clean package consumption
        run: tests/fixtures/typed-specifications/run-clean-consumer.sh

  commands-tests:
    name: Commands tests and authored public surface (publish gate)
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: tests/FS.GG.SDD.Commands.Tests/FS.GG.SDD.Commands.Tests.fsproj
      - name: Test (FS.GG.SDD.Commands)
        run: dotnet test tests/FS.GG.SDD.Commands.Tests/FS.GG.SDD.Commands.Tests.fsproj -c Release --no-restore

  cli-tests:
    name: CLI tests (publish gate)
    runs-on: ubuntu-latest
    # Fork events never satisfy this guard ⇒ no publish path runs on a fork (FR-009).
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # No restore cache: this job restores a single project (narrow footprint) and
          # setup-dotnet keys the cache only on hashFiles(packages.lock.json)+OS+runtime with
          # no per-job component, so caching here would share and poison the deterministic
          # gate's key (#92 / NU1403). Release runs rarely; a fresh restore is fine.

      # Locked restore via the shared composite action (feature 064).
      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: tests/FS.GG.SDD.Cli.Tests/FS.GG.SDD.Cli.Tests.fsproj

      # The gate (research Decision 6): publish-cli `needs` this job, so a red run never
      # reaches the push. ValidateCommandTests covers `registry validate` here.
      - name: Test (FS.GG.SDD.Cli)
        run: dotnet test tests/FS.GG.SDD.Cli.Tests/FS.GG.SDD.Cli.Tests.fsproj -c Release --no-restore

  knowledge-tests:
    name: Knowledge tests (publish gate)
    runs-on: ubuntu-latest
    # Fork events never satisfy this guard ⇒ no publish path runs on a fork (FR-009).
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # No restore cache: this job restores a single project (narrow footprint) and
          # setup-dotnet keys the cache only on hashFiles(packages.lock.json)+OS+runtime with
          # no per-job component, so caching here would share and poison the deterministic
          # gate's key (#92 / NU1403). Release runs rarely; a fresh restore is fine.

      # Locked restore via the shared composite action (feature 064).
      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: tests/FS.GG.SDD.Knowledge.Tests/FS.GG.SDD.Knowledge.Tests.fsproj

      # Knowledge tests gate retained packing and therefore later promotion.
      - name: Test (FS.GG.SDD.Knowledge)
        run: dotnet test tests/FS.GG.SDD.Knowledge.Tests/FS.GG.SDD.Knowledge.Tests.fsproj -c Release --no-restore


  publish-artifacts:
    name: Build and retain four coherent SDD archives once; reuse published Contracts
    needs: [resolve-versions, contracts-tests, artifacts-tests, commands-tests, cli-tests, knowledge-tests]
    runs-on: ubuntu-latest
    # Only a no-push manual dispatch is allowed to create publishable archives. A later tag/release
    # run promotes this run's retained artifact; it must never pack another container (#944).
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version == '' && needs.resolve-versions.outputs.push == 'false'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify the new version is unused on both feeds with native credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-sdd-release-occupancy.py "${{ needs.resolve-versions.outputs.cli_version }}" --contracts-version "${{ needs.resolve-versions.outputs.contracts_version }}"

      - name: Restore (locked)
        uses: ./.github/actions/locked-restore
        with:
          target: src/FS.GG.SDD.Cli/FS.GG.SDD.Cli.fsproj

      - name: Capture the selected published Contracts dependency
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages/dependencies
          curl --fail --location --silent --show-error \
            "https://api.nuget.org/v3-flatcontainer/fs.gg.contracts/${{ needs.resolve-versions.outputs.contracts_version }}/fs.gg.contracts.${{ needs.resolve-versions.outputs.contracts_version }}.nupkg" \
            -o "artifacts/packages/dependencies/FS.GG.Contracts.${{ needs.resolve-versions.outputs.contracts_version }}.nupkg"
          bash scripts/verify-release-candidate.sh --record-contracts artifacts/packages "${{ needs.resolve-versions.outputs.contracts_version }}"

      - name: Pack the reviewed coherent set once
        run: |
          set -euo pipefail
          while IFS= read -r id; do
            dotnet pack "src/$id/$id.fsproj" -c Release \
              -p:RepositoryCommit="$GITHUB_SHA" -p:SourceRevisionId="$GITHUB_SHA" \
              --no-restore -o artifacts/packages
          done < scripts/sdd-release-packages.txt

      - name: Assert package inventory, source binding, and pre-push hashes
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if [ ${#packages[@]} -ne 4 ]; then
            echo "::error::candidate must contain exactly Artifacts, Commands, CLI and Knowledge."
            exit 1
          fi
          for package in "${packages[@]}"; do
            unzip -p "$package" '*.nuspec' | grep -F "commit=\"$GITHUB_SHA\"" >/dev/null \
              || { echo "::error::$package does not bind repository commit $GITHUB_SHA"; exit 1; }
          done
          (
            cd artifacts/packages
            sha256sum *.nupkg | LC_ALL=C sort -k2 > pre-push.sha256
          )
          printf '%s\n' \
            'schema=fsgg.sdd.release-candidate/v4' \
            "head=$GITHUB_SHA" \
            "version=${{ needs.resolve-versions.outputs.cli_version }}" \
            "contracts_version=${{ needs.resolve-versions.outputs.contracts_version }}" \
            'packages=FS.GG.SDD.Artifacts,FS.GG.SDD.Commands,FS.GG.SDD.Cli,FS.GG.SDD.Knowledge' \
            > artifacts/packages/candidate.env
          bash scripts/verify-release-candidate.sh \
            artifacts/packages "$GITHUB_SHA" "${{ needs.resolve-versions.outputs.cli_version }}" "${{ needs.resolve-versions.outputs.contracts_version }}"

      - name: Verify the just-packed CLI is self-contained
        env:
          FSGG_SDD_PACKAGE_DIR: artifacts/packages
        run: bash scripts/verify-cli-tool.sh

      - name: Compare shipped APIs against public 2.2 and cold-consume Commands
        run: bash scripts/verify-sdd-package-api.sh artifacts/packages "${{ needs.resolve-versions.outputs.cli_version }}"

      - name: Qualify the packed Knowledge CLI and SDK
        env:
          FSGG_KNOWLEDGE_VERSION: ${{ needs.resolve-versions.outputs.cli_version }}
          FSGG_KNOWLEDGE_SOURCE: ${{ github.workspace }}/artifacts/packages
        run: bash scripts/verify-knowledge-packages.sh

      - name: Recheck all four archives after package qualification
        run: bash scripts/verify-release-candidate.sh artifacts/packages "$GITHUB_SHA" "${{ needs.resolve-versions.outputs.cli_version }}" "${{ needs.resolve-versions.outputs.contracts_version }}"

      - name: Upload the only publishable package bytes
        uses: actions/upload-artifact@v7
        with:
          name: coherent-sdd-packages-${{ github.sha }}
          path: artifacts/packages/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30

  locate-artifacts:
    name: Preflight retained candidate custody
    needs: [resolve-versions, contracts-tests, artifacts-tests, commands-tests, cli-tests, knowledge-tests]
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version == ''
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_run_id: ${{ steps.locate.outputs.candidate_run_id }}
    steps:
      - name: Locate one successful no-push candidate run at the exact head
        id: locate
        if: needs.resolve-versions.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&status=completed&per_page=100" \
              | jq -r --arg head "$GITHUB_SHA" \
                  '.[] | .workflow_runs[] | select(.head_sha == $head and .conclusion == "success") | .id'
          )
          matches=()
          for run_id in "${run_ids[@]}"; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              | jq --arg name "coherent-sdd-packages-$GITHUB_SHA" \
                  '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
            [ "$count" -eq 0 ] || [ "$count" -eq 1 ] \
              || { echo "::error::run $run_id has duplicate coherent candidate artifacts"; exit 1; }
            [ "$count" -eq 1 ] && matches+=("$run_id")
          done
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error::expected exactly one retained no-push candidate for $GITHUB_SHA; found ${#matches[@]}. Dispatch release.yml without a version exactly once at this commit before tagging/publishing."
            exit 1
          fi
          echo "candidate_run_id=${matches[0]}" >> "$GITHUB_OUTPUT"
          echo "Promoting retained candidate from workflow run ${matches[0]} at $GITHUB_SHA"

      - name: Dry-run custody preflight
        if: needs.resolve-versions.outputs.push == 'false'
        run: echo "No-push dispatch will create the retained candidate in publish-artifacts."

  publish-cli:
    name: Publish and read back the coherent FS.GG.SDD set
    needs: [resolve-versions, locate-artifacts]
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version == '' && needs.resolve-versions.outputs.push == 'true'
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Download the reviewed package bytes
        uses: actions/download-artifact@v8
        with:
          name: coherent-sdd-packages-${{ github.sha }}
          path: artifacts/packages
          run-id: ${{ needs.locate-artifacts.outputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify retained candidate identity and hashes before feed credentials
        run: |
          set -euo pipefail
          bash scripts/verify-release-candidate.sh \
            artifacts/packages "$GITHUB_SHA" "${{ needs.resolve-versions.outputs.cli_version }}" "${{ needs.resolve-versions.outputs.contracts_version }}"

      - name: Refuse occupied versions unless exact retained payloads already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-sdd-release-occupancy.py "${{ needs.resolve-versions.outputs.cli_version }}" --contracts-version "${{ needs.resolve-versions.outputs.contracts_version }}" --candidate artifacts/packages

      - name: Publish the coherent set to GitHub Packages first
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Commands.*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Artifacts.*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Cli.*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Knowledge.*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: NuGet login (OIDC → short-lived nuget.org key)
        id: nuget-login-sdd
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}

      - name: Publish the same bytes to nuget.org
        run: |
          set -euo pipefail
          (cd artifacts/packages && sha256sum --check --strict pre-push.sha256)
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Commands.*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login-sdd.outputs.NUGET_API_KEY }} --skip-duplicate
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Artifacts.*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login-sdd.outputs.NUGET_API_KEY }} --skip-duplicate
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Cli.*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login-sdd.outputs.NUGET_API_KEY }} --skip-duplicate
          dotnet nuget push "artifacts/packages/FS.GG.SDD.Knowledge.*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login-sdd.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Read back both feeds and compare every non-signature entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-versions.outputs.cli_version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/feed-readback
          for id in fs.gg.sdd.artifacts fs.gg.sdd.commands fs.gg.sdd.cli fs.gg.sdd.knowledge; do
            package_version="$VERSION"
            case "$id" in
              fs.gg.sdd.commands) local_package="artifacts/packages/FS.GG.SDD.Commands.$VERSION.nupkg" ;;
              fs.gg.sdd.artifacts) local_package="artifacts/packages/FS.GG.SDD.Artifacts.$VERSION.nupkg" ;;
              fs.gg.sdd.cli) local_package="artifacts/packages/FS.GG.SDD.Cli.$VERSION.nupkg" ;;
              fs.gg.sdd.knowledge) local_package="artifacts/packages/FS.GG.SDD.Knowledge.$VERSION.nupkg" ;;
            esac
            [ -f "$local_package" ] || { echo "::error::reviewed package is missing for $id $VERSION"; exit 1; }
            gh_url="https://nuget.pkg.github.com/FS-GG/download/$id/$package_version/$id.$package_version.nupkg"
            nuget_url="https://api.nuget.org/v3-flatcontainer/$id/$package_version/$id.$package_version.nupkg"
            for attempt in $(seq 1 40); do
              curl --fail --location --silent --show-error -u "$GITHUB_ACTOR:$GH_TOKEN" \
                "$gh_url" -o "artifacts/feed-readback/$id.github.nupkg" && \
              curl --fail --location --silent --show-error \
                "$nuget_url" -o "artifacts/feed-readback/$id.nuget.nupkg" && break
              [ "$attempt" -lt 40 ] || { echo "::error::feed readback timed out for $id $VERSION"; exit 1; }
              sleep 15
            done
            python3 scripts/verify-package-payloads.py "$local_package" \
              "artifacts/feed-readback/$id.github.nupkg" \
              "artifacts/feed-readback/$id.nuget.nupkg"
          done

      - name: Qualify the public Knowledge CLI and SDK
        env:
          FSGG_KNOWLEDGE_VERSION: ${{ needs.resolve-versions.outputs.cli_version }}
          FSGG_KNOWLEDGE_SOURCE: https://api.nuget.org/v3/index.json
        run: bash scripts/verify-knowledge-packages.sh

      - name: Verify clean public installs
        env:
          VERSION: ${{ needs.resolve-versions.outputs.cli_version }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          export NUGET_PACKAGES="$scratch/packages"
          export NUGET_HTTP_CACHE_PATH="$scratch/http"
          dotnet tool install FS.GG.SDD.Cli --version "$VERSION" --tool-path "$scratch/tool" \
            --add-source https://api.nuget.org/v3/index.json --no-cache
          "$scratch/tool/fsgg-sdd" --version | grep -F "$VERSION"
          dotnet new classlib -o "$scratch/consumer" --no-restore
          dotnet add "$scratch/consumer" package FS.GG.SDD.Artifacts --version "$VERSION" \
            --source https://api.nuget.org/v3/index.json --no-restore
          dotnet add "$scratch/consumer" package FS.GG.SDD.Commands --version "$VERSION" \
            --source https://api.nuget.org/v3/index.json --no-restore
          dotnet restore "$scratch/consumer" --source https://api.nuget.org/v3/index.json --no-http-cache

      - name: Set up exact Go toolchain for public Quint acceptance
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.1"
          cache: false

      - name: Provision content-addressed Quint acceptance tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quint-release-tools"
          curl --fail --location --silent --show-error \
            https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 \
            --output "$RUNNER_TEMP/quint-release-tools/quint"
          chmod +x "$RUNNER_TEMP/quint-release-tools/quint"
          printf '%s  %s\n' \
            '939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f' \
            "$RUNNER_TEMP/quint-release-tools/quint" | sha256sum --check --strict
          (
            cd src/FS.GG.SDD.Artifacts/TypedSpecifications/QuintAssets/lmt
            GO111MODULE=off CGO_ENABLED=1 go build -trimpath \
              -ldflags '-buildid=IvXAt1kJ-3iINki1alCT/Ut12KGabgkWIkwVpw-xO/c4zkZMLAubfWHvjZOY8o/8-oR_8tNNndNgfMVoD8F -B 0x03d1703027f57ed4dd2ba90b7cdfc8cdea2815da' \
              -o "$RUNNER_TEMP/quint-release-tools/lmt" main.go
          )
          printf '%s  %s\n' \
            '37e0b0365c2641edce40b48605471f61fa12e97c3e2376152f0e849abdc31f10' \
            "$RUNNER_TEMP/quint-release-tools/lmt" | sha256sum --check --strict
          dotnet tool install fable --version 5.13.0 --tool-path "$RUNNER_TEMP/quint-release-tools/fable"

      - name: Qualify neutral Q2 and Q3 receiver boundaries from the public CLI package
        env:
          QUINT_BIN: ${{ runner.temp }}/quint-release-tools/quint
          LMT_BIN: ${{ runner.temp }}/quint-release-tools/lmt
          FABLE_BIN: ${{ runner.temp }}/quint-release-tools/fable/fable
          Q2_PACKAGE_SOURCE: https://api.nuget.org/v3/index.json
          Q3_PACKAGE_SOURCE: https://api.nuget.org/v3/index.json
          Q2_JUNIT_OUT: artifacts/feed-readback/quint-q2-public.junit.xml
          Q2_EXACT_IR_JUNIT_OUT: artifacts/feed-readback/quint-q2-exact-ir-public.junit.xml
          Q3_JUNIT_OUT: artifacts/feed-readback/quint-q3-public.junit.xml
          Q3_TOOLCHAIN_OUT: artifacts/feed-readback/quint-q3-toolchain.json
        run: |
          set -euo pipefail
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/true
          bash tests/quint-svg-workspace-installed-acceptance.sh

      - name: Upload durable dual-feed receipt
        uses: actions/upload-artifact@v7
        with:
          name: sdd-${{ needs.resolve-versions.outputs.cli_version }}-dual-feed-receipt-${{ github.sha }}
          path: |
            artifacts/packages/pre-push.sha256
            artifacts/packages/candidate.env
            artifacts/packages/contracts-reuse.json
            artifacts/packages/dependencies/*.nupkg
            artifacts/packages/*.nupkg.entries
            artifacts/packages/*.nupkg.payloads
            artifacts/feed-readback/*.payloads
            artifacts/feed-readback/*.entries
            artifacts/feed-readback/*.nupkg
            artifacts/feed-readback/quint-q*-public.junit.xml
            artifacts/feed-readback/quint-q3-toolchain.json
          if-no-files-found: error
          retention-days: 90

  readback-cli:
    name: Read-only coherent SDD dual-feed verification
    runs-on: ubuntu-latest
    if: github.repository == 'FS-GG/FS.GG.SDD' && inputs.readback_version != ''
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read back exact public archives
        id: readback
        env:
          VERSION: ${{ inputs.readback_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo "::error::invalid readback version"; exit 1; }
          git fetch --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          source_head="$(git rev-parse "refs/tags/v$VERSION^{commit}")"
          mkdir -p artifacts/feed-readback
          ids=(fs.gg.sdd.artifacts fs.gg.sdd.cli)
          if git cat-file -e "$source_head:scripts/sdd-release-packages.txt" 2>/dev/null; then
            mapfile -t ids < <(git show "$source_head:scripts/sdd-release-packages.txt" | tr '[:upper:]' '[:lower:]')
          fi
          for id in "${ids[@]}"; do
            gh_url="https://nuget.pkg.github.com/FS-GG/download/$id/$VERSION/$id.$VERSION.nupkg"
            public_url="https://api.nuget.org/v3-flatcontainer/$id/$VERSION/$id.$VERSION.nupkg"
            for attempt in $(seq 1 40); do
              curl --fail --location --silent --show-error -u "$GITHUB_ACTOR:$GH_TOKEN" \
                "$gh_url" -o "artifacts/feed-readback/$id.github.nupkg" && \
              curl --fail --location --silent --show-error \
                "$public_url" -o "artifacts/feed-readback/$id.nuget.nupkg" && break
              [ "$attempt" -lt 40 ] || { echo "::error::feed readback timed out for $id $VERSION"; exit 1; }
              sleep 15
            done
            for feed in github nuget; do
              package="artifacts/feed-readback/$id.$feed.nupkg"
              unzip -p "$package" '*.nuspec' | grep -F "commit=\"$source_head\"" >/dev/null \
                || { echo "::error::$package does not bind tag source $source_head"; exit 1; }
            done
            python3 scripts/verify-package-payloads.py \
              "artifacts/feed-readback/$id.github.nupkg" \
              "artifacts/feed-readback/$id.nuget.nupkg"
          done
          echo "source_head=$source_head" >> "$GITHUB_OUTPUT"
      - name: Retain read-only feed archives and payload maps
        uses: actions/upload-artifact@v7
        with:
          name: sdd-${{ inputs.readback_version }}-dual-feed-readback-${{ steps.readback.outputs.source_head }}
          path: artifacts/feed-readback/*
          if-no-files-found: error
          retention-days: 90
