name: GOV423 full Verify Debug and Release qualification

# Qualification branch only. It consumes the original no-push candidate unchanged.
# No release trigger, producer build/pack, publication, secrets or default-branch change.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gov423-selected-governance-loader-source-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Full Verify Debug and Release exact-feed qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          cache: false
      - name: Check source-only preparation
        run: python3 tests/fixtures/gov423-loader-package/preflight.py
      - name: Qualify original packages in an isolated consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/fixtures/gov423-loader-package/qualify.py "$RUNNER_TEMP/gov423-governance-loader-evidence" --governance --full-verify
      - name: Retain exact inputs and observed result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gov423-governance-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gov423-governance-loader-evidence-bundle.tar.gz
            ${{ runner.temp }}/gov423-governance-loader-evidence/*.log
            ${{ runner.temp }}/gov423-governance-loader-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
