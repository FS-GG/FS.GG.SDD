# skill-view-check — the REQUIRED skill gate, and the replacement for the retired `skill-union` caller.
#
# ADR-0067 §8 (the loud absence check) and §9 (nothing is retired before its replacement is proven).
# Decided on FS-GG/.github#1715 as blocker B5 of
# `docs/coordination/skill-apparatus-retirement-order.md` §5, shape (b), with the repository owner's
# authorization. This file IS that replacement, and it landed BEFORE the caller it replaces was
# deleted and before the required context moved — see THE SWAP below.
#
# WHAT THIS REPO USED TO REQUIRE, AND WHY IT STOPPED MEANING ANYTHING. `.github/workflows/skill-union.yml`
# was a `uses:` of FS-GG/.github's reusable `skill-union-assert.yml`, and its context
# `skill-union / skill-union` was a required status check on `main`. That gate asserts one thing: the
# runtime roots hold the BYTE-IDENTICAL UNION of the same skills. ADR-0067 phase 4 makes one of those
# roots a generated VIEW of the other — a symlink, resolved at checkout, never committed (§6) — and on
# that layout the gate's two headline invariants both become tautologies. Measured on this repo's own
# tree, at a dry-run retirement, 2026-07-28:
#
#   skill-union-assert --roots ".agents/skills"                    -> exit 2, "no skills found under
#                                                                      any root"
#   skill-union-assert --roots ".claude/skills .agents/skills"     -> exit 0, "in-every-root=32/32
#                                                                      byte-identical=32/32 ... OK"
#
# Read those two together. `union_ids()` enumerates with `find` and no `-L`, so the VIEW ROOT
# CONTRIBUTES ZERO IDS — that is the first line, on its own. Every one of the 32 ids in the second line
# therefore came from the tracked root alone, and the view root passed the presence test only because
# presence is `[ -d ]` **through** the symlink, which cannot fail. "byte-identical=32/32" is 32
# comparisons of a file with itself. The gate would have kept reporting `success` on a REQUIRED context
# while asserting nothing about the view — a green indistinguishable from a green that means something,
# which is epic #266 in its most expensive form.
#
# WHAT THIS ASSERTS INSTEAD. `skill-view check --source .claude/skills`: every skill the SOURCE
# directory declares is VISIBLE at every runtime root the contract still names, with ADR-0067 §8's
# absence classes reported separately — [absent-root], [dangling-root], [text-file-root],
# [not-a-directory-root], [missing-skill], [dangling-skill], [not-a-file-skill], [unreadable-skill],
# [empty-skill]. Those are the failure modes phase 1 (FS-GG/.github#1621) measured as **exit 0 with no
# diagnostic in BOTH runtimes** (Claude Code 2.1.220, Codex CLI 0.145.0) — an agent that quietly has no
# skills. This check is the only thing that says so.
#
# AND IT CAN FAIL, WHICH IS THE ENTIRE JUSTIFICATION FOR THE SWAP. Mutation-checked on this repo's own
# tree rather than asserted (FS-GG/.github#1715 AC3):
#
#   the generated view removed   -> exit 1, "[absent-root] .agents/skills does not exist"
#   the source root emptied      -> exit 2, "the expected skill set is EMPTY — refusing to report
#                                    'everything is visible' over nothing"
#
# A leg that survives its own mutation is repaired or dropped, never shipped. Both mutations red this
# one, in CI, by run id; the ids are in FS-GG/.github#1715.
#
# WHAT `skill-view check` DOES **NOT** ASSERT, SAID OUT LOUD — AND WHAT NOW DOES (FS.GG.SDD#771).
# `skill-view check` does not compare the two roots' BYTES against each other, so on its own, while
# this repo still commits two independent copies of its skills, it is weaker than the union gate in
# exactly that one direction: a skill present in `.agents/skills` and absent from `.claude/skills` is
# outside its subject. That gap was not theoretical. It is precisely how
# `.agents/skills/skill-manifest.json` — this repo's producer-authoritative process manifest, 6,891
# tracked bytes — came to exist in NO OTHER ROOT, where ADR-0067 phase 4 would have deleted it and
# `git status --porcelain` would have come back EMPTY (measured on `387adc6`, FS.GG.SDD#771).
#
# So the second step below closes it: `scripts/check-root-asymmetry.sh` asserts every non-source root
# is a SUBSET of `.claude/skills`, byte for byte — the `diff -r` that found the defect, kept where
# something runs it rather than in a reviewer's memory (FS.GG.SDD#771 AC2). It is mutation-checked by
# `scripts/tests/check-root-asymmetry.test.sh`, which `gate` runs, and leg 2 of that test IS the
# measured `387adc6` layout.
#
# THE ASYMMETRY IS DELIBERATELY ONE-DIRECTIONAL. `[second-root-only]` is fatal; `[source-only]` is
# reported and is not. The source root legitimately carries more than a view does: `skill-view
# generate --mode copy` copies `<id>/` skill directories and NO top-level files, so
# `.claude/skills/skill-manifest.json` has no counterpart in a copy-mode view by construction. That
# is also why FS.GG.SDD#771 moved the manifest's READERS rather than resolving them through the view.
# Do not "tidy" the check into a symmetric `diff -r` — it would forbid the layout this repo chose.
#
# Both directions stopped mattering on 2026-07-28, when `.agents/skills` BECAME a view of
# `.claude/skills` (FS-GG/.github#1760) — a view cannot diverge from what it is a view of. The check
# stays anyway, and deliberately: it is the only thing that would notice a future root that is NOT a
# view, and leg 9 of its test is what proves the invocation below still has a subject in this tree.
# `kit / coordination-kit` continues to grade the kit-owned skills' bytes against this repo's pin
# throughout. Do not read that as coverage of the rest: a `coordination-coherence` green is evidence
# about the kit's skills, never about the tree (FS-GG/.github#1504).
#
# THE TOOL IS THIS REPO'S OWN COPY, NEVER A MOVING HUB `main`. `scripts/skill-view` is delivered and
# byte-verified by the `FS.GG.Kit` version this repo pins (a kit row since 0.15.0), together with the
# two libraries it sources at load, `scripts/lib/args.sh` and `scripts/lib/roots.sh` — `repos.sh
# validate` refuses a kit that separates them. A receiver's verdict must be a function of the receiver
# (FS-GG/.github#1584); that is also the difference from the workflow this replaces, whose script came
# from the authority's `@main` on every run.
#
# THE ROOT SET IS NOT NAMED HERE, DELIBERATELY. No `--roots`, so it comes from `lib/roots.sh` — the same
# precedence parser every other reader in this repo resolves with (FS-GG/.github#525): `--roots` >
# `$AGENT_SKILL_ROOTS` > `.agent-skill-roots` > the default. This repo commits no `.agent-skill-roots`,
# so the effective set is ADR-0065's two as amended by ADR-0067 §5 — `.claude/skills .agents/skills` —
# which is the SAME set the retired caller audited, so this swap narrows nothing. `.codex/skills` is in
# no gate's subject: ADR-0067 §5 retired it from the runtime contract. Do NOT add `--roots` to "fix"
# that; it would re-arm a gate on a root the contract retired, and widening or narrowing the audited
# set is a declared decision, not a caller's convenience.
#
# THE `pull_request` TRIGGER CARRIES NO `paths:` FILTER, AND MUST NOT GAIN ONE. The context below is
# REQUIRED on `main`. GitHub does not synthesise a neutral check run for a workflow a path filter
# excluded — it never creates the check run at all — and branch protection cannot tell that apart from
# a check that has not reported yet, so it holds every unrelated pull request at "Expected — waiting for
# status to be reported", forever. The org has already paid for that combination twice, both times in
# FS.GG.SDD (#370, #525), and the sibling required gates in this repo carry the same standing note.
# `scripts/
# check-required-contexts.py` now models it and `required-context-coherence.yml` sweeps for it nightly,
# but the deadlock is still yours to avoid. Keeping the filter on `push:` is safe and is not the same
# question: a `push` filter has no bearing on what a pull request reports.
#
# THE JOB NAME IS PUBLIC API. Branch protection requires the literal context string this job produces.
# Renaming the job renames the context, the required one then never reports, and the repository stops
# merging with no commit in it having changed — the FS.GG.Audio#60 shape that
# `docs/coordination/reusable-workflow-contract.md` exists for. Change it only by sequencing it against
# the protection setting, never as a tidy-up.
#
# THE SWAP WAS ATOMIC, AND THE ORDER IS THE POINT (FS-GG/.github#1715 AC4). Producer first, requirement
# second, old producer last:
#   1. this file landed on `main`, reporting on its own pull request, while `skill-union` was still
#      required and still reporting;
#   2. `skill-view-check` was added to the required contexts (`scripts/repos.sh require-context`, an
#      ADD-ONLY verb that cannot delete);
#   3. `skill-union / skill-union` was removed from them (`unrequire-context`, a separate verb with its
#      own `--confirm-remove`);
#   4. only then was `.github/workflows/skill-union.yml` deleted.
# At no instant did this branch require a context no workflow could report. Reversing steps 3 and 4 is
# the wedge; there is never a reason to.
#
# =================================================================================================
# THE SECOND COMMITTED ROOT IS RETIRED, AND THIS FILE CHANGED IN THAT SAME PULL REQUEST.
# =================================================================================================
# ADR-0067 phase 4 landed for this repo on FS-GG/.github#1760 — the seventh and last receiver. It
# untracks `.agents/skills` and git-ignores it, so the VIEW root does not exist in a fresh checkout: a
# clean clone, a new worktree and this runner alike. Without a generate, the first check step below
# correctly reports `[absent-root]` and this REQUIRED context is RED on every pull request. Measured
# on a bare checkout of the retired tree, 2026-07-28: exit 1.
#
# So the generate lands ahead of the checks, in the same commit that untracks the root — never before
# it (`skill-view generate` refuses a root git TRACKS, with no override, and would die), and never
# after it (that is the RED window). `--roots` names the VIEW root explicitly, exactly as
# `FsggKitViewSkillRoots` does for the materializer: letting the tool fall back to the default pair
# would also try to resolve `.claude/skills`, this repo's tracked source, and be a refusal rather than
# a no-op.
#
# It is NOT conditional on whether the root happens to be missing, and it must never become so.
# "Generate whatever is absent, then assert it is present" is the fail-open shape this whole item
# exists to remove: it would make [absent-root] unreachable and hand back a gate that cannot fail. The
# generate is authorised by the repo DECLARING a root to be a view — in `<FsggKitViewSkillRoots>`,
# `.config/kit/FS.GG.Kit.receiver.proj` — never by observing that one is missing.
#
# THE SAME GENERATE EXISTS IN TWO OTHER PLACES, AND NEITHER IS A DUPLICATE. `gate.yml`'s `gate` job
# needs its own step because leg 9 of `scripts/tests/check-root-asymmetry.test.sh` runs the real check
# over the real tree. `FsggSddGenerateSkillView` in the receiver project covers the trees where the
# MATERIALIZE runs — `gate.yml`'s required `Shared-build-config drift check` job and, critically,
# `kit-materialize.yml`, which is a `uses:` of FS-GG/.github's reusable workflow and therefore cannot
# be given a step by this repo at all. All three were measured RED on a bare checkout of the retired
# tree without them.
#
# =================================================================================================
# THE §8 ALARM RIDES THIS CONTEXT, AND THAT IS WHY IT IS NOT DECORATION.
# =================================================================================================
# The retirement removes the only gate that would have noticed `.agents/skills` LEAVING the runtime
# contract later. Measured on this repo's own tree with `<FsggKitViewSkillRoots>` emptied and the
# directory deleted: the materialize reports "no view skill roots declared — nothing to assert" and
# succeeds, and `coordination-sync --check --against-pin` reports "OK — all 28 materialized file(s)" —
# and that second one IS the required context `kit / coordination-kit`. The required set passes on
# exactly the tree the alarm exists to fail. `skill-view check --receiver-proj` is that alarm, and it
# runs here because `skill-view-check` is REQUIRED on `main` (read from branch protection, not from a
# workflow comment — FS.GG.Audio#212), and needs no .NET SDK or restore.
#
# IT USED TO BE `scripts/check-skill-view-roots.sh`, 23,050 BYTES OF THIS REPO'S OWN — the largest of
# the five surviving hand-copies (FS-GG/.github#1710/#1777). Five receivers retired their second
# committed skill root, ADR-0067 §8 obliged each to replace the loud failure it removed, and each
# hand-wrote the same alarm on the same day: 23,050 / 21,353 / 18,346 / 18,277 / 14,864 bytes for one
# invariant. The delivery seam already existed — `scripts/skill-view` is a kit-delivered file this
# repo pins and byte-verifies — so the assertion lives THERE now and this repo calls it. Deleting the
# copy is a net SAFETY GAIN rather than a tidy-up: the shared implementation grades a partial view per
# skill by identity where the copy compared directory counts, and adds the tracked-view-root lane the
# copy never had. Nothing this repo's copy asserted is lost — its declaration lane is `--receiver-proj`,
# its resolution lane is `check`'s own (which already separated all four absence classes, so this repo's
# FS.GG.Audio#212 fix is preserved by construction), and its `*_can_fire` demos are `skill-view selftest`.

name: skill-view-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-view-check:
    name: skill-view-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # UNCONDITIONAL, and ahead of all three assertions. `.agents/skills` is a VIEW root: git-ignored,
      # and therefore absent in this checkout exactly as it is in every fresh clone. See the header
      # block for why this may be neither conditional nor moved.
      - name: Resolve the view root this tree no longer commits
        run: bash scripts/skill-view generate --source .claude/skills --roots ".agents/skills"

      # ADR-0067 §8's replacement alarm DEMONSTRATES IT CAN FIRE, and the demonstration now ships
      # inside the tool (FS-GG/.github#1710/#1770). `scripts/check-skill-view-roots.sh` used to carry
      # its own `*_can_fire` fixtures — 23,050 bytes of them, one of five such files in the fleet with
      # a 55% size spread over one invariant. The collapse put the assertion and its demo in
      # `scripts/skill-view`, which is a kit-delivered file this repo already pins and byte-verifies,
      # so this repo now runs the SAME demonstration the hub does rather than a copy of it. Offline,
      # about a second, and it asserts the SPECIFIC diagnostic class each negative case emits — a demo
      # that only counts failures survives a mutation collapsing two branches into one, which is
      # exactly how FS.GG.Audio#212 shipped green on a dangling root for a day.
      - name: Demonstrate every lane of the skill-root alarm can fire
        run: bash scripts/skill-view selftest

      # ADR-0067 §8's replacement alarm itself, and this repo's visibility check, in ONE call — the
      # two are lanes of `skill-view check` since FS-GG/.github#1710.
      #
      # `--receiver-proj` is LANE 1, THE DECLARATION, and it is what replaces the deleted script. The
      # retirement left no other gate able to see `.agents/skills` leave the runtime contract:
      # measured on this repo's own tree with `<FsggKitViewSkillRoots>` emptied and the directory
      # deleted, the materialize reports "no view skill roots declared — nothing to assert" and
      # `coordination-sync --check --against-pin` reports OK — and that second one IS the required
      # context `kit / coordination-kit`. The required set passes on exactly the tree this reds. The
      # lane runs FIRST inside `check` and its fault is FATAL before the roots loop, so a broken
      # DECLARATION is reported as such rather than as a missing directory — the ordering the two
      # separate steps used to buy by hand.
      #
      # NO `--absent-ok`, DELIBERATELY, and it is a property of this HOST rather than of the check.
      # An absent view root is RED here because the `skill-view generate` step above runs immediately
      # before, and `FsggSddGenerateSkillView` covers every tree the materialize runs in. By the time
      # this runs the view MUST exist, so absence means the generate was removed or did not run.
      # FS.GG.Audio's and FS.GG.Templates' hosts are bare checkouts and legitimately pass
      # `--absent-ok`; importing that carve-out here would make this lane unfalsifiable.
      #
      # `--receiver-proj` also SUPERSEDES the root-set precedence note in the header for this step:
      # the roots now come from the declaration being graded rather than from `lib/roots.sh`, which is
      # the whole point of the lane. It narrows nothing — this repo declares
      # `<FsggKitSkillRoots>.claude/skills</…>` and `<FsggKitViewSkillRoots>.agents/skills</…>`, whose
      # union is the same ADR-0011 pair `lib/roots.sh` defaults to, and `--expect-roots` defaults to
      # that pair too. `--roots` and `--receiver-proj` are mutually exclusive by construction.
      #
      # The expected SKILL set is still the SOURCE directory, never a manifest: `registry`-style
      # manifests declare a subset of a tree's skills and would stay green over a tree that had lost
      # the rest, which is FS-GG/.github#1504's coherent-but-incomplete class. A source directory
      # cannot be a subset of itself. The kit's version grades a partial view PER SKILL BY IDENTITY,
      # where the deleted script compared directory COUNTS — a view with the right count and the wrong
      # names reds here and would not have there — and adds a lane no copy of this repo's had: git
      # must TRACK nothing under a declared view root (adopted from FS.GG.Net's copy).
      - name: Assert the runtime skill-root declaration and every skill's visibility at every root
        run: |
          bash scripts/skill-view check \
            --source .claude/skills \
            --tree . \
            --receiver-proj .config/kit/FS.GG.Kit.receiver.proj

      # FS.GG.SDD#771 AC2. The step above asks "is everything the source declares VISIBLE at each
      # root"; this one asks the opposite direction, which nothing has asked since `skill-union /
      # skill-union` was retired on 2026-07-28: "does any root carry something the source does NOT".
      # That is the class ADR-0067 phase 4 deletes with a clean `git status`, and it is how this
      # repo's own producer manifest was found. Placed in THIS job so it inherits the required
      # `skill-view-check` context — a new job would need adding to branch protection to mean
      # anything, and until then would be a check nobody has to pass.
      #
      # NO `--roots` HERE EITHER, for the reason in the header: the set comes from `lib/roots.sh`,
      # the same precedence parser every other reader in this repo resolves with.
      #
      # `.agents/skills` IS a view now, so this step depends on the same `skill-view generate` at the
      # top of the job that the step above does — it refuses an absent root with exit 2 rather than
      # passing over nothing, deliberately. One generate serves all three.
      - name: Assert no runtime root carries anything .claude/skills does not
        run: bash scripts/check-root-asymmetry.sh --source .claude/skills --tree .
